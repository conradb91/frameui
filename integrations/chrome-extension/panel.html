<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrameUI Capture</title><link rel="stylesheet" href="panel.css"></head><body><header><strong>FrameUI</strong><span>Capture</span></header><main><label>Design name<input id="name" maxlength="120" value="Chrome capture"></label><label>Capture width<select id="width"><option value="1440">1440 px</option><option value="1920">1920 px</option></select></label><div class="actions"><button id="follow" class="primary">Follow flow</button><button id="done" class="primary" hidden>Done</button><button id="capture">Capture page</button></div><p class="hint">Follow your clicks. Wait for each screen to save, then select Done.</p><div id="status" role="status" aria-live="polite">Ready</div><div id="error" role="alert" hidden><span></span><button aria-label="Dismiss error">×</button></div><details id="flow"><summary id="count">No screens captured</summary><ol id="screens"></ol><button id="clear" class="text">Clear flow</button></details><details id="notes" hidden><summary>Capture notes</summary><ul></ul></details><div class="export"><button id="xd" class="primary" disabled>Export to XD</button><button id="send" disabled>Send to FrameUI</button></div><details class="more"><summary>More</summary><button id="frameui" disabled>Save capture file</button><p class="hint">Send to FrameUI needs the local bridge. See README.txt in the extension folder. All captures stay on your computer. Only visited states are included.</p></details></main><script type="module" src="panel.js"></script></body></html>
