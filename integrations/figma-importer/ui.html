<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:18px;font:12px Inter,system-ui,sans-serif;color:var(--figma-color-text);background:var(--figma-color-bg)}h1{font-size:18px;margin:0 0 5px}p{color:var(--figma-color-text-secondary);line-height:1.45;margin:0}.drop{display:grid;place-items:center;gap:7px;min-height:130px;margin:18px 0;padding:18px;border:1px dashed var(--figma-color-border);border-radius:8px;text-align:center;background:var(--figma-color-bg-secondary)}.drop strong{font-size:13px}.drop input{position:absolute;opacity:0;pointer-events:none}.button,button{border:0;border-radius:6px;padding:8px 12px;font:600 12px inherit;cursor:pointer}.button{background:var(--figma-color-bg-brand);color:var(--figma-color-text-onbrand)}button{background:var(--figma-color-bg-tertiary);color:var(--figma-color-text)}button.primary{background:var(--figma-color-bg-brand);color:var(--figma-color-text-onbrand)}button:disabled{opacity:.45;cursor:default}.summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}.summary div{padding:9px;border:1px solid var(--figma-color-border);border-radius:6px}.summary strong,.summary span{display:block}.summary span{margin-top:2px;color:var(--figma-color-text-secondary)}.options{display:grid;gap:8px;margin:14px 0}.options label{display:flex;gap:8px;align-items:center}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}.hidden{display:none!important}.progress{margin-top:22px}.track{height:5px;margin:12px 0;background:var(--figma-color-bg-tertiary);border-radius:3px;overflow:hidden}.track i{display:block;height:100%;background:var(--figma-color-bg-brand);transition:width .2s}.notice{padding:10px;margin:12px 0;border-radius:6px;background:var(--figma-color-bg-secondary);line-height:1.45}.warning{color:var(--figma-color-text-warning)}ul{padding-left:18px;max-height:130px;overflow:auto;color:var(--figma-color-text-secondary)}
</style></head><body>
<section id="choose"><h1>FrameUI Importer</h1><p>Import designs created in FrameUI and continue editing them in Figma.</p><label class="drop"><input id="file" type="file" accept=".frameui"><strong>Choose FrameUI file</strong><span id="filename">Select a .frameui package</span><span class="button">Choose file</span></label><div id="detected" class="hidden"><strong>Detected</strong><div class="summary"><div><strong id="artboards">0</strong><span>artboards</span></div><div><strong id="components">0</strong><span>components</span></div><div><strong id="assets">0</strong><span>assets</span></div><div><strong id="variables">0</strong><span>variables</span></div></div><div class="options"><label><input id="opt-designs" type="checkbox" checked> Designs</label><label><input id="opt-components" type="checkbox" checked> Components</label><label><input id="opt-variables" type="checkbox" checked> Design variables</label><label><input id="opt-images" type="checkbox" checked> Images</label><label><input id="opt-prototype" type="checkbox" checked> Prototype information</label></div><div class="actions"><button id="import" class="primary">Import into Figma</button></div></div><div id="error" class="notice warning hidden"></div></section>
<section id="working" class="progress hidden"><h1>Importing FrameUI design</h1><p id="stage">Preparing document</p><div class="track"><i id="bar" style="width:5%"></i></div><p id="count"></p><div class="actions"><button id="cancel">Cancel</button></div></section>
<section id="complete" class="hidden"><h1>FrameUI import complete</h1><p>Your design is now made from native, editable Figma layers.</p><div id="complete-summary" class="summary"></div><div id="warning-box" class="hidden"><p class="warning" id="warning-count"></p><ul id="warnings"></ul></div><div class="actions"><button id="close" class="primary">Close</button></div></section>
<script>
const $=id=>document.getElementById(id);let parsed=null
function bytesToText(bytes){return new TextDecoder().decode(bytes)}
function storedZip(buffer){const bytes=new Uint8Array(buffer),view=new DataView(buffer),files=new Map();let offset=0;while(offset+30<=bytes.length&&view.getUint32(offset,true)===0x04034b50){const method=view.getUint16(offset+8,true),size=view.getUint32(offset+18,true),nameLength=view.getUint16(offset+26,true),extraLength=view.getUint16(offset+28,true);if(method!==0)throw new Error('This package uses unsupported ZIP compression. Export it again from FrameUI.');const name=bytesToText(bytes.slice(offset+30,offset+30+nameLength)),start=offset+30+nameLength+extraLength;files.set(name,bytes.slice(start,start+size));offset=start+size}return files}
function json(files,name){const value=files.get(name);if(!value)throw new Error('The package is missing '+name+'.');return JSON.parse(bytesToText(value))}
$('file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const files=storedZip(await file.arrayBuffer()),manifest=json(files,'manifest.json'),documentFile=json(files,'document.json'),componentFile=json(files,'components.json'),tokenFile=json(files,'tokens.json'),assetFile=json(files,'assets.json'),interactionFile=json(files,'interactions.json'),warningFile=json(files,'warnings.json');if(manifest.formatVersion!=='1.0.0')throw new Error('This FrameUI package version is not supported.');const assets=(assetFile.assets||[]).map(asset=>({...asset,bytes:Array.from(files.get(asset.path)||[])}));parsed={manifest,document:documentFile,components:componentFile.components||[],tokens:tokenFile.tokens||[],assets,interactions:interactionFile.interactions||[],packageWarnings:warningFile.warnings||[]};$('filename').textContent=file.name;$('artboards').textContent=manifest.artboardCount;$('components').textContent=manifest.componentCount;$('assets').textContent=manifest.assetCount;$('variables').textContent=manifest.tokenCount;$('detected').classList.remove('hidden');$('error').classList.add('hidden')}catch(error){parsed=null;$('detected').classList.add('hidden');$('error').textContent=error.message||String(error);$('error').classList.remove('hidden')}}
$('import').onclick=()=>{if(!parsed)return;$('choose').classList.add('hidden');$('working').classList.remove('hidden');parent.postMessage({pluginMessage:{type:'import',payload:{...parsed,options:{designs:$('opt-designs').checked,components:$('opt-components').checked,variables:$('opt-variables').checked,images:$('opt-images').checked,prototype:$('opt-prototype').checked}}}},'*')}
$('cancel').onclick=()=>parent.postMessage({pluginMessage:{type:'cancel'}},'*');$('close').onclick=()=>parent.postMessage({pluginMessage:{type:'close'}},'*')
onmessage=e=>{const message=e.data.pluginMessage;if(!message)return;if(message.type==='progress'){const total=Math.max(1,message.total),value=Math.max(5,Math.min(95,message.completed/total*100));$('stage').textContent=message.stage;$('count').textContent=message.total?message.completed+' of '+message.total:'';$('bar').style.width=value+'%'}if(message.type==='complete'){$('working').classList.add('hidden');$('complete').classList.remove('hidden');$('complete-summary').innerHTML=Object.entries(message.stats).map(([key,value])=>'<div><strong>'+value+'</strong><span>'+key+'</span></div>').join('');if(message.warnings.length){$('warning-box').classList.remove('hidden');$('warning-count').textContent=message.warnings.length+' item'+(message.warnings.length===1?'':'s')+' require attention';$('warnings').innerHTML=message.warnings.map(w=>'<li></li>').join('');[...$('warnings').children].forEach((li,i)=>li.textContent=message.warnings[i])}}if(message.type==='cancelled'){location.reload()}if(message.type==='error'){$('working').classList.add('hidden');$('choose').classList.remove('hidden');$('error').textContent=message.message;$('error').classList.remove('hidden')}}
</script></body></html>
