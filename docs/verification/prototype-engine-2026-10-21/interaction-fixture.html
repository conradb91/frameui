<!doctype html><title>Crew prototype</title><style>body{font:16px Arial;margin:32px;background:#f7f8fc;color:#162239}button{padding:10px 18px;margin:6px;background:white;border:1px solid #3266ff;border-radius:6px}button[aria-selected=true]{background:#3266ff;color:white}.tabs{display:flex}main{padding:24px;background:white}dialog{border:0;border-radius:12px}dialog::backdrop{background:#0005}#table{height:110px;overflow:auto;width:420px}td{padding:8px;border-bottom:1px solid #eee}</style><h1>Crew readiness</h1><div class="tabs"><button aria-selected="true" onclick="tab(this,'Safety')">Safety</button><button aria-selected="false" onclick="tab(this,'Library')">Library</button><button aria-selected="false" onclick="tab(this,'Training')">Training</button></div><main><h2 id="title">Safety</h2><button onclick="document.querySelector('dialog').showModal()">View crew</button><details><summary>View more</summary><p>Required certificates and training.</p></details><div id="table"><table><tbody></tbody></table></div></main><dialog><h2>Crew details</h2><p>Ready for duty.</p><button onclick="this.closest('dialog').close()">Close details</button></dialog><script>function tab(button,title){document.querySelector('#title').textContent=title;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b===button)))}document.querySelector('tbody').innerHTML=Array.from({length:20},(_,i)=>'<tr><td>Crew member '+(i+1)+'</td><td>Complete</td></tr>').join('')</script>
