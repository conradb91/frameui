<!doctype html><meta charset="utf-8"><title>Crew readiness</title>
<style>body{margin:0;padding:32px;font:14px Arial;color:#273344;background:#f8fafc}.tabs{display:flex;background:white;border:1px solid #ddd}.tabs button{flex:1;padding:18px;border:0;border-top:3px solid transparent;background:white}.tabs button.active{border-top-color:#286cff;color:#286cff}.panel{padding:24px;background:white}button{cursor:pointer} .table{height:180px;overflow:auto;border:1px solid #ddd}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:14px;border-bottom:1px solid #eee}dialog{margin-right:0;height:80%;width:320px;border:1px solid #ddd}dialog::backdrop{background:#0004}</style>
<div class="tabs"><button class="active" onclick="switchTab(0)">Safety familiarisation</button><button onclick="switchTab(1)">Library and policy</button><button onclick="switchTab(2)">Baseline knowledge</button></div>
<div class="panel"><h1 id="title">Safety familiarisation</h1><p id="description">Crew safety completion</p><details><summary>Expand outstanding items</summary><p>Review missing required items before departure.</p></details><div class="table"><table><thead><tr><th>Crew member</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><button onclick="document.querySelector('dialog').showModal()">View crew</button></div>
<dialog><h2>View crew drawer</h2><p>James Mitchell · Captain</p><button onclick="this.closest('dialog').close()">Close drawer</button></dialog>
<script>const titles=['Safety familiarisation','Library and policy','Baseline knowledge'];function switchTab(i){document.querySelectorAll('.tabs button').forEach((b,n)=>b.classList.toggle('active',n===i));document.querySelector('#title').textContent=titles[i];document.querySelector('#description').textContent=['Crew safety completion','Policy reading completion','Knowledge assessment results'][i];document.querySelector('#rows').innerHTML=Array.from({length:20},(_,n)=>'<tr><td>Member '+(n+1)+'</td><td>'+['Compliant','Read','Passed'][i]+'</td></tr>').join('')}switchTab(0)</script>
